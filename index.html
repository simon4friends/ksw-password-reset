<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="referrer" content="no-referrer">
  <title>Reset password | KSW Kampot Ordering</title>
  <style>
    :root { color-scheme: light; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; color: #172522; background: #f3f7f5; }
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 20px; }
    main { width: 100%; max-width: 430px; padding: 28px; background: #fff; border: 1px solid #e1e9e5; border-radius: 20px; box-shadow: 0 12px 38px rgba(15, 55, 39, .09); }
    .mark { display: inline-flex; align-items: center; justify-content: center; width: 46px; height: 46px; border-radius: 14px; background: #08784e; color: #fff; font-weight: 800; letter-spacing: .04em; }
    h1 { margin: 18px 0 6px; font-size: 25px; line-height: 1.2; }
    .sub, #status { color: #53645f; line-height: 1.55; }
    label { display: block; margin: 18px 0 7px; font-size: 14px; font-weight: 650; }
    input { width: 100%; padding: 13px 14px; border: 1px solid #cbd8d2; border-radius: 10px; font: inherit; font-size: 16px; background: white; color: #172522; }
    input:focus { outline: 3px solid #b8e5d1; border-color: #08784e; }
    button { width: 100%; margin-top: 20px; padding: 14px; border: 0; border-radius: 11px; background: #08784e; color: #fff; font: inherit; font-weight: 700; cursor: pointer; }
    button:disabled { opacity: .65; cursor: wait; }
    form[hidden] { display: none; }
    .hint { margin-top: 16px; font-size: 13px; color: #687872; line-height: 1.5; }
  </style>
</head>
<body>
  <main>
    <div class="mark" aria-hidden="true">KSW</div>
    <h1>Reset your password</h1>
    <p class="sub">KSW Kampot Ordering</p>
    <p id="status" role="status" aria-live="polite">Checking your secure reset link…</p>
    <form id="request-form" hidden>
      <label for="email">Email address</label>
      <input id="email" type="email" autocomplete="email" required>
      <button id="request-button" type="submit">Send a reset email</button>
    </form>
    <form id="reset-form" hidden>
      <label for="pw">New password</label>
      <input id="pw" type="password" minlength="8" autocomplete="new-password" required>
      <label for="pw2">Confirm new password</label>
      <input id="pw2" type="password" minlength="8" autocomplete="new-password" required>
      <button id="save" type="submit">Save new password</button>
    </form>
    <p class="hint">Use at least 8 characters. For your security, only the newest valid reset link can be used.</p>
  </main>
  <script type="module">
    import { createClient } from "https://esm.sh/@supabase/supabase-js@2";
    const supabase = createClient(
      "https://clbdnbepcurcijgxkcxy.supabase.co",
      "sb_publishable_9iKx1ujHh8qAlA_Ps-sWMQ_nbzOiyzE",
      { auth: { detectSessionInUrl: false, persistSession: true, autoRefreshToken: true } }
    );
    const status = document.getElementById("status");
    const requestForm = document.getElementById("request-form");
    const resetForm = document.getElementById("reset-form");
    const cleanUrl = () => history.replaceState(null, document.title, location.pathname);
    try {
      const url = new URL(location.href);
      const hash = new URLSearchParams(url.hash.slice(1));
      const tokenHash = url.searchParams.get("token_hash");
      const type = url.searchParams.get("type") || hash.get("type");
      const authError = url.searchParams.get("error_description") || hash.get("error_description");
      if (authError) throw new Error(authError.replace(/\+/g, " "));
      if (tokenHash && type === "recovery") {
        const { error } = await supabase.auth.verifyOtp({ token_hash: tokenHash, type: "recovery" });
        if (error) throw error;
        cleanUrl();
      } else if (hash.get("access_token") && hash.get("refresh_token") && type === "recovery") {
        const { error } = await supabase.auth.setSession({
          access_token: hash.get("access_token"),
          refresh_token: hash.get("refresh_token")
        });
        if (error) throw error;
        cleanUrl();
      } else {
        status.textContent = "To get a fresh secure link, enter your account email below.";
        requestForm.hidden = false;
      }
      if (!requestForm.hidden) {
        // A request form is intentionally shown only when this page has no recovery token.
      } else {
        status.textContent = "Your link is verified. Choose a new password below.";
        resetForm.hidden = false;
      }
    } catch (err) {
      status.textContent = (err?.message || "We couldn't verify this reset link.") + " You can request a fresh email below.";
      requestForm.hidden = false;
    }
    requestForm.addEventListener("submit", async (event) => {
      event.preventDefault();
      const button = document.getElementById("request-button");
      button.disabled = true;
      button.textContent = "Sending…";
      const email = document.getElementById("email").value.trim();
      const redirectTo = location.origin + location.pathname;
      const { error } = await supabase.auth.resetPasswordForEmail(email, { redirectTo });
      if (error) {
        status.textContent = "We couldn't send the reset email: " + error.message;
        button.disabled = false;
        button.textContent = "Send a reset email";
        return;
      }
      status.textContent = "If an account exists for that address, a reset email has been sent. Open the newest email and tap its reset link in Safari.";
      requestForm.hidden = true;
    });
    resetForm.addEventListener("submit", async (event) => {
      event.preventDefault();
      const password = document.getElementById("pw").value;
      const confirmation = document.getElementById("pw2").value;
      if (password !== confirmation) { status.textContent = "The passwords do not match."; return; }
      if (password.length < 8) { status.textContent = "Use at least 8 characters."; return; }
      const button = document.getElementById("save");
      button.disabled = true;
      button.textContent = "Saving…";
      const { error } = await supabase.auth.updateUser({ password });
      if (error) {
        status.textContent = "Password update failed: " + error.message;
        button.disabled = false;
        button.textContent = "Save new password";
        return;
      }
      resetForm.hidden = true;
      status.textContent = "Password updated successfully. You can now sign in with your new password.";
    });
  </script>
</body>
</html>
